name: CI

on:
  push:
    branches:
      - main
      - "ticket/**"
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, check, test and build (containerized)
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE/site":/app
          -w /app
          node:20-alpine
          sh -lc "npm ci && npm run release:preflight"

      - name: Dist integrity checks
        run: ./scripts/check_dist_integrity.sh

      - name: Gallery readiness (allow missing in CI)
        run: ./scripts/check_gallery_assets.sh --allow-missing

      - name: Staging smoke checks (containerized)
        run: ./scripts/ci_smoke_staging.sh

      - name: Generate responsive visual snapshots
        run: bash ./scripts/ci_visual_snapshots.sh

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-snapshots
          path: output/visual-snapshots
          if-no-files-found: error
          retention-days: 14
